org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true

# Unit tests for the release build too (AGP 9 makes them for debug only by default), so a test can prove the
# release build carries the real update URL and version and no test hook.
android.onlyEnableUnitTestForTheTestedBuildType=false

# The app version lives here and only here. versionCode is computed from it in app/build.gradle.kts
# (major * 10000 + minor * 100 + patch), so bumping this one value is all a release needs.
ddf.versionName=1.3.0
